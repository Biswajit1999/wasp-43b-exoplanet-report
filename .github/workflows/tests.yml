name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/analyze_transit.py
      - run: python scripts/analyze_multisector.py
      - run: python scripts/analyze_atmospheric_evidence.py
      - run: python scripts/analyze_spectrum.py
      - run: python scripts/analyze_energy_budget.py
      - run: python scripts/analyze_phase_identifiability.py
      - run: python scripts/verify_zenodo_provenance.py
      - run: pytest tests/ -v
