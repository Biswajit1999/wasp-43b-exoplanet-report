name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/analyze_transit.py
      - run: python scripts/analyze_multisector.py
      - run: python scripts/analyze_atmospheric_evidence.py
      - run: python scripts/analyze_spectrum.py
      - run: python scripts/analyze_energy_budget.py
      - run: python scripts/analyze_phase_identifiability.py
      - run: python scripts/verify_zenodo_provenance.py
      - run: pytest tests/ -v
